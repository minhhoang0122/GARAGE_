server:
  port: ${PORT:8081}
  address: 0.0.0.0
  shutdown: graceful
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    max-connections: 10000
  connection-timeout: 60000
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 2048

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: garage-management
  
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:garamanagementsystem}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:talama123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: GarageHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    async:
      request-timeout: 60000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dqo1j8heb}
    api-key: ${CLOUDINARY_API_KEY:232314616123637}
    api-secret: ${CLOUDINARY_API_SECRET:Ixfb9dW_AVyodjgis1O6Tj0ybb4}

# Cấu hình bảo mật
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456789}
  expiration: 86400000 # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Biến môi trường bổ sung
RESEND_API_KEY: ${RESEND_API_KEY:}
RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:noreply@letanlex.id.vn}

# Cấu hình thanh toán SePay / VietQR
payment:
  bank:
    id: MB
    account: "0945197256"
    name: "LE TAN LEX"

logging:
  level:
    root: INFO
    com.gara: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO